# config.yaml — LATHE ADAPTIVE SESSION STRATEGY v1
# Credentials are NOT here — they come from environment variables
# (MT5_LOGIN, MT5_PASSWORD, MT5_SERVER). Never commit credentials.
#
# Values marked REVIEW are not specified in the strategy document. They carry
# conventional defaults so the machinery runs, but they decide real behaviour
# and are yours to set deliberately.

# Authorized instruments. The bot refuses to start on anything not listed.
symbols:
  - EURUSD
  - USDJPY

timeframes:
  regime: H1            # EMA20/EMA50 + ADX14 + ATR14 backdrop
  setup: M15            # where a setup is identified
  entry: M5             # where the entry is refined

poll_seconds: 30

session:
  timezone: America/New_York
  start: "22:00"
  end: "06:00"          # crosses midnight; Fri/Sat opens are skipped (FX shut)

# Rule 1 — market regime. Thresholds are from the strategy document.
regime:
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  atr_period: 14
  trend_adx_min: 20.0            # SPEC trend needs ADX >= 20
  trend_separation_atr: 0.25     # SPEC ...and EMA gap >= 0.25 x ATR
  range_adx_max: 18.0            # SPEC range needs ADX < 18
  range_separation_atr: 0.20     # SPEC ...and EMA gap <= 0.20 x ATR
  # Anything satisfying neither is UNCLEAR, and unclear means hold.
  # Score band cut-offs (the spec gives bands, not thresholds):
  strong_adx: 25.0                    # REVIEW 25 pts vs 20 for a trend
  strong_separation_atr: 0.50         # REVIEW
  strong_range_adx: 15.0              # REVIEW
  strong_range_separation_atr: 0.10   # REVIEW

setups:
  enabled:
    - trend_pullback
    - range_reversion
    - breakout_retest
  # Minimum reward:risk is fixed by the strategy: 2.0 for trend and breakout,
  # 1.5 for range. See MIN_RR in setups.py.

# Setup geometry. SPEC values come straight from the strategy document.
setup_params:
  pullback_structure_atr: 0.25   # SPEC valid pullback distance
  entry_buffer_atr: 0.05         # SPEC entry beyond the trigger candle
  stop_buffer_atr: 0.20          # SPEC stop beyond structure
  trigger_bars: 3                # SPEC 3-bar M5 break
  order_expiry_bars: 3           # SPEC cancel if not triggered in 3 M5 candles
  breakout_lookback: 12          # SPEC 12-bar M15 structure
  breakout_buffer_atr: 0.10      # SPEC
  breakout_expansion: 1.20       # SPEC candle range vs median of 20
  breakout_median_bars: 20       # SPEC
  retest_max_bars: 3             # SPEC
  retest_distance_atr: 0.15      # SPEC
  rsi_period: 14                 # SPEC
  rsi_long_max: 35.0             # SPEC
  rsi_short_min: 65.0            # SPEC
  range_zone_pct: 0.20           # SPEC outer 20% of the range
  range_target_pct: 0.80         # SPEC ~80% toward the far side
  target_r: 2.0                  # SPEC base target
  swing_lookback: 2              # REVIEW bars either side of a swing point
  range_lookback: 20             # REVIEW bars defining "recent range structure"
  ema_fast: 20                   # REVIEW M15 EMAs used as pullback structure
  ema_slow: 50
  atr_period: 14
  location_excellent: 0.40       # REVIEW location score bands
  location_good: 0.70

scoring:
  min_score: 80         # from the strategy spec

risk:
  risk_per_trade_pct: 0.01     # selectable: 0.005 | 0.01 | 0.02
  max_daily_loss_pct: 0.05     # daily stop
  account_drawdown_pct: 0.10   # account kill switch, from the equity high-water mark
  max_concurrent_trades: 1
  max_trades_per_session: 3
  max_lot_size: 1.0
  broker_utc_offset_hours: 0   # REVIEW: your broker's server timezone

management:
  atr_stop_multiple: 0.5   # REVIEW: ATR pad beyond the structural level
  breakeven_at_r: 1.0
  breakeven_offset_r: 0.0  # REVIEW: push past entry to cover spread/commission
  trail_start_r: 1.5
  trail_distance_r: 1.0    # REVIEW: how far behind price the trail sits
  target_r: 2.0

protection:
  spread_median_multiple: 1.5    # SPEC spread <= 1.5 x recent median
  spread_atr_max: 0.10           # SPEC spread / ATR_M5 <= 0.10
  spread_history: 50             # REVIEW bars of spread history kept
  stop_min_spread_multiple: 2.0  # SPEC stop >= 2 x current spread
  stop_max_atr_multiple: 1.5     # SPEC stop <= 1.5 x ATR_M15
  max_spread_pips: 2.0     # REVIEW: EUR/USD and USD/JPY widen overnight —
                           # this is the Asian session, so set it from your
                           # broker's actual 22:00-06:00 spreads, not its
                           # advertised typical spread.
  consecutive_loss_limit: 2
  cooldown_scope: session  # REVIEW: "session" sits out the rest of it;
                           # "minutes" uses cooldown_minutes instead
  cooldown_minutes: 0
  max_candle_age_seconds: 1800   # must be > the setup timeframe (M15 = 900s),
                                 # or a healthy bar looks stale just before
                                 # the next one closes

  # High-impact news blackout. The MetaTrader5 Python API exposes no economic
  # calendar, so these are entered by hand until a feed is wired in. Anything
  # not listed here is NOT blacked out.
  news_blackout_minutes_before: 30
  news_blackout_minutes_after: 30
  news_blackout_windows: []
  #  - {label: "US CPI", start: "2026-10-13T12:30:00Z"}

pip:
  size: 0.0001
  value_per_lot: 10
  overrides:
    USDJPY:
      size: 0.01
      value_per_lot: 6.7    # REVIEW: depends on your account currency and rate

state:
  path: ".lathe_state.json"

vault:
  log_path: "../vault/output/trades.md"
