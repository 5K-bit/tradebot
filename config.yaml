# config.yaml — LATHE ADAPTIVE SESSION STRATEGY v1
# Credentials are NOT here — they come from environment variables
# (MT5_LOGIN, MT5_PASSWORD, MT5_SERVER). Never commit credentials.
#
# Values marked REVIEW are not specified in the strategy document. They carry
# conventional defaults so the machinery runs, but they decide real behaviour
# and are yours to set deliberately.

# Authorized instruments. The bot refuses to start on anything not listed.
symbols:
  - EURUSD
  - USDJPY

timeframes:
  regime: H1            # EMA20/EMA50 + ADX14 + ATR14 backdrop
  setup: M15            # where a setup is identified
  entry: M5             # where the entry is refined

poll_seconds: 30

session:
  timezone: America/New_York
  start: "22:00"
  end: "06:00"          # crosses midnight; Fri/Sat opens are skipped (FX shut)

regime:
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  atr_period: 14
  adx_trend_min: 25.0   # REVIEW: ADX at/above this = trending
  adx_range_max: 20.0   # REVIEW: ADX at/below this = ranging.
                        # Between the two is neither, and neither means no trade.

setups:
  enabled:
    - trend_pullback
    - range_reversion
    - breakout_retest
  # Minimum reward:risk is fixed by the strategy: 2.0 for trend and breakout,
  # 1.5 for range. See MIN_RR in setups.py.

scoring:
  min_score: 80         # from the strategy spec

risk:
  risk_per_trade_pct: 0.01     # selectable: 0.005 | 0.01 | 0.02
  max_daily_loss_pct: 0.05     # daily stop
  account_drawdown_pct: 0.10   # account kill switch, from the equity high-water mark
  max_concurrent_trades: 1
  max_trades_per_session: 3
  max_lot_size: 1.0
  broker_utc_offset_hours: 0   # REVIEW: your broker's server timezone

management:
  atr_stop_multiple: 0.5   # REVIEW: ATR pad beyond the structural level
  breakeven_at_r: 1.0
  breakeven_offset_r: 0.0  # REVIEW: push past entry to cover spread/commission
  trail_start_r: 1.5
  trail_distance_r: 1.0    # REVIEW: how far behind price the trail sits
  target_r: 2.0

protection:
  max_spread_pips: 2.0     # REVIEW: EUR/USD and USD/JPY widen overnight —
                           # this is the Asian session, so set it from your
                           # broker's actual 22:00-06:00 spreads, not its
                           # advertised typical spread.
  consecutive_loss_limit: 2
  cooldown_scope: session  # REVIEW: "session" sits out the rest of it;
                           # "minutes" uses cooldown_minutes instead
  cooldown_minutes: 0
  max_candle_age_seconds: 1800   # must be > the setup timeframe (M15 = 900s),
                                 # or a healthy bar looks stale just before
                                 # the next one closes

  # High-impact news blackout. The MetaTrader5 Python API exposes no economic
  # calendar, so these are entered by hand until a feed is wired in. Anything
  # not listed here is NOT blacked out.
  news_blackout_minutes_before: 30
  news_blackout_minutes_after: 30
  news_blackout_windows: []
  #  - {label: "US CPI", start: "2026-10-13T12:30:00Z"}

pip:
  size: 0.0001
  value_per_lot: 10
  overrides:
    USDJPY:
      size: 0.01
      value_per_lot: 6.7    # REVIEW: depends on your account currency and rate

state:
  path: ".lathe_state.json"

vault:
  log_path: "../vault/output/trades.md"
