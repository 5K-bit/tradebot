name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # build-only rehearsal; publishes nothing

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on master and match VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1; }
            git fetch origin master
            git merge-base --is-ancestor HEAD origin/master || { echo "tagged commit is not on master"; exit 1; }
          fi
          test -s "docs/releases/v$version.md" || { echo "docs/releases/v$version.md is missing"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package the source
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="tradebot-$VERSION/" -o "dist/tradebot-$VERSION.zip" HEAD
          unzip -l "dist/tradebot-$VERSION.zip" | tail -3
          cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
