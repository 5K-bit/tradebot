[pytest]
testpaths = tests

# Warnings are failures. A ResourceWarning here means the bot leaked a file
# handle; a DeprecationWarning means something it relies on is going away. On
# a bot that runs unattended for days against real money, both are worth
# knowing about while they are still cheap to fix.
filterwarnings =
    error

# Typos in markers or config keys should fail loudly rather than silently
# disabling whatever they were meant to enable.
addopts =
    --strict-markers
    --strict-config
